spring:
  application:
    name: banking-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/*.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true # Enable hibernate statistics

  # Problem detail
  mvc:
    problemdetails:
      enabled: true

  cache:
    cache-names:
      - customer-with-accounts
      - adult-customers
      - account-types
    caffeine:
      spec: maximumSize=500,expireAfterWrite=2m,recordStats

# Application logs level
logging:
  level:
    root: INFO
    com.clientes.cuentas.bankingservice: DEBUG

# Expose actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
