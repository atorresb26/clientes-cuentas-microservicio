openapi: 3.0.3
info:
  title: Gestión de cuentas bancarias API
  version: 1.0.0

tags:
  - name: Clientes
    description: Operaciones relacionadas con los clientes y cuentas bancarias relacionadas.

paths:
  /clientes:
    get:
      tags:
        - Clientes
      summary: Obtener todos los clientes con sus cuentas
      operationId: getCustomersAndAccounts
      responses:
        '200':
          description: Lista de todos los clientes con sus datos personales y las cuentas bancarias asociadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerAccount'
#        '401':
#          $ref: '#/components/responses/Unauthorized'
#        '403':
#          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: "#/components/responses/InternalServerError"

# TODO -> Separar componentes en otro fichero
components:
  schemas:
    Problem:
      type: object
      description: |
        Respuesta de error estándar según RFC 7807 «Detalles del problema para API HTTP».
        Este objeto proporciona detalles legibles sobre un error.
      required:
        - type
        - title
        - status
      properties:
        status:
          type: integer
          format: int32
          description: Código de estado HTTP para esta incidencia del problema.
          example: 404
        title:
          type: string
          description: |
            Un resumen breve y legible del problema.
            No debe cambiar entre las distintas apariciones del mismo error.
          example: Customer not found
        detail:
          type: string
          description: Una explicación legible y específica para esta ocurrencia del problema.
          example: Customer with id 123 was not found.
        instance:
          type: string
          format: uri
          description: Una referencia URI que identifica la ocurrencia específica del problema.
          example: /customers/123
        timestamp:
          type: string
          format: date-time
          description: Time when the error occurred
          example: "2026-03-14T19:30:21Z"
    BankAccountNoCustomer:
      type: object
      properties:
        accountType:
          type: string
          example: 'NORMAL'
        total:
          type: number
          format: double
          example: '1000.50'
    CustomerAccount:
      type: object
      properties:
        dni:
          type: string
          example: '00000000Z'
        name:
          type: string
          example: 'Adrián'
        surname1:
          type: string
          example: 'Torres'
        surname2:
          type: string
          example: 'Barca'
        birthDate:
          type: string
          format: date
          example: '26/09/1993'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/BankAccountNoCustomer'

  responses:
    BadRequest:
      description: Parámetros de solicitud no válidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidRequest:
              summary: Invalid query parameter
              value:
                type: https://api.example.com/problems/invalid-request
                title: Invalid request
                status: 400
                detail: Query parameter 'limit' must be greater than 0
                instance: /customers?limit=-1
    Unauthorized:
      description: Se requiere autenticación para acceder a este recurso.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            missingToken:
              summary: Missing authentication token
              value:
                type: https://api.example.com/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Authentication credentials were not provided.
                instance: /customers
            invalidToken:
              summary: Invalid authentication token
              value:
                type: https://api.example.com/problems/invalid-token
                title: Invalid authentication token
                status: 401
                detail: The access token provided is expired or invalid.
                instance: /customers
    Forbidden:
      description: El usuario autenticado no tiene permiso para acceder a este recurso.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            insufficientPermissions:
              summary: User lacks required permissions
              value:
                type: https://api.example.com/problems/forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                instance: /customers
            roleNotAllowed:
              summary: Role not allowed
              value:
                type: https://api.example.com/problems/insufficient-role
                title: Access denied
                status: 403
                detail: Only administrators can access this resource.
                instance: /admin/customers
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            customerNotFound:
              summary: Customer does not exist
              value:
                type: https://api.example.com/problems/customer-not-found
                title: Customer not found
                status: 404
                detail: Customer with id 123 was not found
                instance: /customers/123
    InternalServerError:
      description: Error inesperado del servidor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            serverError:
              summary: Unexpected error
              value:
                status: 500
                title: Internal Server Error
                detail: Unexpected error occurred
                instance: /customers
                timestamp: 2026-03-14T19:30:21Z
